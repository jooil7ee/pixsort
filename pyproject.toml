[project]
name = "pixsort"
version = "0.1.0"
description = "Rename pix(image and video) files using timestamp information"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0.0",
    "exifread>=3.0.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "customtkinter>=5.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "resources",
    "log",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
